<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#5447ff"
  >

  <meta
    name="application-name"
    content="Neo Carnivore"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Neo Carnivore"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <title>Neo Carnivore Community</title>

  <style>
    :root{
      color-scheme:light;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      min-height:100%;
      margin:0;
    }

    body{
      min-height:100svh;

      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(120px, calc(96px + env(safe-area-inset-bottom)));

      display:flex;
      align-items:center;
      justify-content:center;

      color:#171717;

      background:
        radial-gradient(
          circle at 50% 17%,
          rgba(118,108,255,.14),
          rgba(255,255,255,0) 35%
        ),
        #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        YuGothic,
        Meiryo,
        sans-serif;

      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button{
      font:inherit;
    }

    .neo-join-page{
      width:min(100%,580px);
      margin:auto;
      text-align:center;
    }


    /* ========================================
       上部Discordアイコン
       iPhone描画安定版
       ======================================== */

    .neo-join-page__logo-float{
      width:86px;
      height:86px;

      margin:0 auto 28px;

      animation:
        neoFloatDiscordIcon
        7s
        ease-in-out
        infinite;

      -webkit-backface-visibility:hidden;
      backface-visibility:hidden;
    }

    .neo-join-page__logo{
      position:relative;

      display:flex;

      width:100%;
      height:100%;

      margin:0;

      align-items:center;
      justify-content:center;

      border:1px solid rgba(84,71,255,.26);
      border-radius:27px;

      color:#fff;

      background-color:#5a4fff;

      background-image:
        linear-gradient(
          135deg,
          #2d20e8 0%,
          #5a4fff 48%,
          #978fff 100%
        );

      box-shadow:
        0 20px 45px rgba(45,32,255,.28),
        0 0 35px rgba(84,71,255,.24),
        0 0 72px rgba(118,108,255,.18),
        inset 0 1px 0 rgba(255,255,255,.55),
        inset 0 -1px 0 rgba(31,20,180,.18);

      opacity:1;

      overflow:hidden;
      isolation:isolate;

      -webkit-backface-visibility:hidden;
      backface-visibility:hidden;
    }

    .neo-join-page__logo svg{
      position:relative;
      z-index:2;

      display:block;

      width:48px;
      height:48px;

      color:#fff;
      fill:#fff;
      opacity:1;

      -webkit-backface-visibility:hidden;
      backface-visibility:hidden;
    }

    .neo-join-page__logo svg path{
      fill:#fff;
      opacity:1;
    }

    @keyframes neoFloatDiscordIcon{
      0%{
        transform:translateY(0);
      }

      25%{
        transform:translateY(-10px);
      }

      50%{
        transform:translateY(-18px);
      }

      75%{
        transform:translateY(-8px);
      }

      100%{
        transform:translateY(0);
      }
    }


    /* ========================================
       見出し
       ======================================== */

    .neo-join-page__eyebrow{
      margin:0 0 13px;

      color:#6459ff;

      font-size:13px;
      line-height:1.4;
      letter-spacing:.08em;
      font-weight:850;
    }

    .neo-join-page__title{
      margin:0;

      color:#171717;

      font-size:clamp(38px,8vw,60px);
      line-height:1.12;
      letter-spacing:-.055em;
      font-weight:900;
    }

    .neo-join-page__title span{
      display:inline-block;

      background:
        linear-gradient(
          115deg,
          #2d20ff 0%,
          #5447ff 28%,
          #948dff 58%,
          #3124e8 100%
        );

      background-size:180% 180%;

      -webkit-background-clip:text;
      background-clip:text;

      color:transparent;
      -webkit-text-fill-color:transparent;

      animation:
        neoTitleGradient
        4.5s
        ease-in-out
        infinite;
    }

    .neo-join-page__description{
      max-width:460px;

      margin:23px auto 0;

      color:#666;

      font-size:15px;
      line-height:1.85;
      letter-spacing:.01em;
      font-weight:600;
    }


    /* ========================================
       CTA接続部分
       ======================================== */

    .neo-community-join-v111{
      position:relative;

      width:100%;

      padding:48px 0 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        YuGothic,
        Meiryo,
        sans-serif;
    }

    .neo-community-join-v111__glow{
      position:absolute;

      top:calc(50% + 24px);
      left:50%;

      width:min(620px,90vw);
      height:180px;

      transform:translate(-50%,-50%);

      background:
        radial-gradient(
          ellipse at center,
          rgba(84,71,255,.20) 0%,
          rgba(118,108,255,.10) 38%,
          rgba(255,255,255,0) 72%
        );

      filter:blur(20px);
      pointer-events:none;
    }


    /* CTA本体 */

    .neo-community-join-v111__button{
      position:relative;
      z-index:1;

      display:flex;

      width:min(100%,580px);
      min-height:80px;

      margin:0 auto;
      padding:3px;

      border:1px solid rgba(84,71,255,.24);
      border-radius:999px;

      color:#fff;

      background:
        linear-gradient(
          115deg,
          #2419d8 0%,
          #4134ff 20%,
          #766cff 46%,
          #948dff 57%,
          #6459ff 75%,
          #2c20dc 100%
        );

      background-size:200% 200%;

      box-shadow:
        0 12px 24px rgba(45,32,255,.25),
        0 4px 10px rgba(45,32,255,.16),
        inset 0 1px 0 rgba(255,255,255,.42),
        inset 0 -1px 0 rgba(15,8,130,.20);

      cursor:pointer;
      touch-action:manipulation;

      overflow:hidden;
      isolation:isolate;

      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      -webkit-touch-callout:default;

      transition:
        transform .28s cubic-bezier(.2,.8,.2,1),
        box-shadow .28s ease,
        filter .28s ease;

      animation:
        neoCommunityJoinGradient-v111
        5s
        ease-in-out
        infinite;
    }


    /* ボタン内側 */

    .neo-community-join-v111__content{
      position:relative;
      z-index:2;

      display:grid;
      grid-template-columns:44px 1fr 44px;

      width:100%;
      min-height:74px;

      align-items:center;
      gap:15px;

      padding:12px 18px;

      border-radius:999px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.11) 0%,
          rgba(255,255,255,.02) 46%,
          rgba(15,8,130,.10) 100%
        );
    }


    /* 光が横切る演出 */

    .neo-community-join-v111__shine{
      position:absolute;
      z-index:1;

      top:-60%;
      left:-35%;

      width:24%;
      height:220%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.34),
          transparent
        );

      transform:rotate(18deg);
      pointer-events:none;

      animation:
        neoCommunityJoinShine-v111
        4.8s
        ease-in-out
        infinite;
    }


    /* Discordアイコン */

    .neo-community-join-v111__discord-icon{
      display:flex;

      width:44px;
      height:44px;

      align-items:center;
      justify-content:center;

      border:1px solid rgba(255,255,255,.22);
      border-radius:50%;

      background:rgba(255,255,255,.14);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25),
        0 7px 18px rgba(20,10,130,.16);
    }

    .neo-community-join-v111__discord-icon svg{
      display:block;
      width:24px;
      height:24px;
    }


    /* CTA文字 */

    .neo-community-join-v111__text{
      display:block;

      text-align:center;

      font-size:18px;
      line-height:1.35;
      letter-spacing:.02em;
      font-weight:850;

      text-shadow:
        0 1px 2px rgba(20,10,120,.20);
    }


    /* 右矢印 */

    .neo-community-join-v111__arrow{
      display:flex;

      width:44px;
      height:44px;

      align-items:center;
      justify-content:center;

      border:1px solid rgba(255,255,255,.25);
      border-radius:50%;

      color:#3327e8;
      background:#fff;

      box-shadow:
        0 7px 18px rgba(20,10,130,.23),
        inset 0 1px 0 rgba(255,255,255,.8);

      transition:
        transform .28s cubic-bezier(.2,.8,.2,1),
        box-shadow .28s ease;
    }

    .neo-community-join-v111__arrow svg{
      display:block;
      width:21px;
      height:21px;
    }


    /* タップ時 */

    .neo-community-join-v111__button:active{
      transform:translateY(1px) scale(.992);

      box-shadow:
        0 8px 18px rgba(45,32,255,.21),
        0 3px 8px rgba(45,32,255,.14),
        inset 0 1px 0 rgba(255,255,255,.36);
    }


    /* キーボード操作 */

    .neo-community-join-v111__button:focus-visible,
    .neo-join-page__copy:focus-visible{
      outline:3px solid rgba(84,71,255,.28);
      outline-offset:6px;
    }


    /* ========================================
       リンクコピー
       ======================================== */

    .neo-join-page__copy{
      display:inline-flex;

      margin:20px auto 0;
      padding:10px 15px;

      align-items:center;
      justify-content:center;
      gap:7px;

      border:0;
      border-radius:999px;

      color:#696969;
      background:transparent;

      font-size:13px;
      line-height:1.4;
      font-weight:700;

      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .neo-join-page__copy svg{
      width:17px;
      height:17px;
    }

    .neo-join-page__status{
      min-height:20px;

      margin:10px 0 0;

      color:#6459ff;

      font-size:12px;
      line-height:1.5;
      font-weight:750;
    }


    /* ========================================
       右下固定案内UI
       ======================================== */

    .neo-browser-reload-guide{
      position:fixed;

      right:max(16px,env(safe-area-inset-right));
      bottom:max(16px,env(safe-area-inset-bottom));

      z-index:9999;

      display:grid;
      grid-template-columns:42px 1fr;

      width:min(330px,calc(100vw - 32px));
      min-height:68px;

      padding:9px 14px 9px 9px;

      align-items:center;
      gap:10px;

      border:1px solid rgba(84,71,255,.14);
      border-radius:21px;

      color:#252525;
      background:rgba(255,255,255,.93);

      box-shadow:
        0 16px 42px rgba(30,24,90,.15),
        0 4px 12px rgba(30,24,90,.08),
        inset 0 1px 0 rgba(255,255,255,.9);

      -webkit-backdrop-filter:blur(18px);
      backdrop-filter:blur(18px);

      text-align:left;

      pointer-events:none;

      animation:
        neoReloadGuideAppear
        .6s
        .35s
        both;
    }

    .neo-browser-reload-guide__icon{
      display:flex;

      width:42px;
      height:42px;

      align-items:center;
      justify-content:center;

      border-radius:14px;

      color:#fff;

      background:
        linear-gradient(
          135deg,
          #4134ff,
          #8b82ff
        );

      box-shadow:
        0 8px 18px rgba(65,52,255,.25);
    }

    .neo-browser-reload-guide__icon svg{
      width:22px;
      height:22px;
    }

    .neo-browser-reload-guide__text{
      display:block;

      font-size:11px;
      line-height:1.45;
      letter-spacing:.01em;
      font-weight:650;
    }

    .neo-browser-reload-guide__text strong{
      display:block;

      margin-top:1px;

      color:#4134ff;

      font-size:13px;
      line-height:1.4;
      font-weight:850;
    }

    .neo-browser-reload-guide__inline-icon{
      display:inline-flex;

      width:19px;
      height:19px;

      margin:0 2px;

      align-items:center;
      justify-content:center;

      border:1px solid rgba(84,71,255,.20);
      border-radius:50%;

      color:#4134ff;
      background:rgba(84,71,255,.08);

      font-family:
        Arial,
        sans-serif;

      font-size:15px;
      line-height:1;
      font-weight:900;

      vertical-align:-2px;
    }


    /* ========================================
       アニメーション
       ======================================== */

    @keyframes neoTitleGradient{
      0%,
      100%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }
    }

    @keyframes neoCommunityJoinGradient-v111{
      0%,
      100%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }
    }

    @keyframes neoCommunityJoinShine-v111{
      0%,
      55%{
        left:-35%;
        opacity:0;
      }

      65%{
        opacity:1;
      }

      84%{
        left:115%;
        opacity:0;
      }

      100%{
        left:115%;
        opacity:0;
      }
    }

    @keyframes neoReloadGuideAppear{
      from{
        opacity:0;
        transform:translateY(18px) scale(.96);
      }

      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }


    /* ========================================
       PCホバー
       ======================================== */

    @media(hover:hover){
      .neo-community-join-v111__button:hover{
        transform:
          translateY(-4px)
          scale(1.012);

        box-shadow:
          0 16px 30px rgba(45,32,255,.31),
          0 6px 14px rgba(45,32,255,.19),
          inset 0 1px 0 rgba(255,255,255,.48),
          inset 0 -1px 0 rgba(15,8,130,.20);

        filter:
          brightness(1.05)
          saturate(1.06);
      }

      .neo-community-join-v111__button:hover
      .neo-community-join-v111__arrow{
        transform:translateX(4px);

        box-shadow:
          0 9px 22px rgba(20,10,130,.28),
          inset 0 1px 0 rgba(255,255,255,.8);
      }

      .neo-join-page__copy:hover{
        color:#4134ff;
        background:rgba(84,71,255,.06);
      }
    }


    /* ========================================
       スマホ
       ======================================== */

    @media(max-width:749px){
      body{
        align-items:flex-start;

        padding:
          max(56px,env(safe-area-inset-top))
          18px
          max(118px,calc(94px + env(safe-area-inset-bottom)));
      }

      .neo-join-page__logo-float{
        width:76px;
        height:76px;

        margin-bottom:25px;
      }

      .neo-join-page__logo{
        border-radius:24px;
      }

      .neo-join-page__logo svg{
        width:43px;
        height:43px;
      }

      .neo-join-page__eyebrow{
        font-size:12px;
      }

      .neo-join-page__description{
        font-size:14px;
      }

      .neo-community-join-v111{
        padding:40px 0 0;
      }

      .neo-community-join-v111__button{
        min-height:72px;
      }

      .neo-community-join-v111__content{
        grid-template-columns:40px 1fr 40px;

        min-height:66px;

        gap:10px;

        padding:10px 12px;
      }

      .neo-community-join-v111__discord-icon,
      .neo-community-join-v111__arrow{
        width:40px;
        height:40px;
      }

      .neo-community-join-v111__discord-icon svg{
        width:22px;
        height:22px;
      }

      .neo-community-join-v111__arrow svg{
        width:19px;
        height:19px;
      }

      .neo-community-join-v111__text{
        font-size:15px;
        letter-spacing:.01em;
      }

      .neo-browser-reload-guide{
        grid-template-columns:40px 1fr;

        width:min(340px,calc(100vw - 28px));
        min-height:64px;

        right:max(14px,env(safe-area-inset-right));
        bottom:max(14px,env(safe-area-inset-bottom));

        padding:8px 12px 8px 8px;

        border-radius:19px;
      }

      .neo-browser-reload-guide__icon{
        width:40px;
        height:40px;

        border-radius:13px;
      }

      .neo-browser-reload-guide__text{
        font-size:10px;
      }

      .neo-browser-reload-guide__text strong{
        font-size:12px;
      }

      .neo-browser-reload-guide__inline-icon{
        width:18px;
        height:18px;

        font-size:14px;
      }
    }


    /* ========================================
       動きを抑える設定
       ======================================== */

    @media(prefers-reduced-motion:reduce){
      .neo-join-page__logo-float,
      .neo-join-page__title span,
      .neo-community-join-v111__button,
      .neo-community-join-v111__shine,
      .neo-browser-reload-guide{
        animation:none;
        transition:none;
      }
    }
  </style>
</head>

<body>

  <main class="neo-join-page">

    <div class="neo-join-page__logo-float">
      <div
        class="neo-join-page__logo"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24">
          <path
            fill="#ffffff"
            d="M19.54 5.34A16.3 16.3 0 0 0 15.44 4l-.5 1.02a15.1 15.1 0 0 0-5.87 0L8.55 4a16.5 16.5 0 0 0-4.1 1.35C1.85 9.2 1.15 12.95 1.5 16.65a16.6 16.6 0 0 0 5.03 2.53l1.21-1.66a10.2 10.2 0 0 1-1.9-.92l.46-.36c3.67 1.7 7.65 1.7 11.28 0l.47.36c-.61.36-1.25.67-1.91.92l1.21 1.66a16.7 16.7 0 0 0 5.04-2.53c.41-4.29-.7-8-2.85-11.31ZM8.52 14.4c-1.1 0-2-1.02-2-2.27s.88-2.28 2-2.28c1.13 0 2.02 1.03 2 2.28 0 1.25-.89 2.27-2 2.27Zm6.97 0c-1.1 0-2-1.02-2-2.27s.88-2.28 2-2.28c1.13 0 2.02 1.03 2 2.28 0 1.25-.87 2.27-2 2.27Z"
          />
        </svg>
      </div>
    </div>

    <p class="neo-join-page__eyebrow">
      肉食実践者コミュニティ
    </p>

    <h1 class="neo-join-page__title">
      &nbsp;&nbsp;&nbsp;Discordで、<br>
      <span>&nbsp;&nbsp;コミュニティに参加。</span>
    </h1>

    <p class="neo-join-page__description">
      招待リンクが正しく表示されない場合は、<br>
      ブラウザ右下の更新ボタン<span
        class="neo-browser-reload-guide__inline-icon"
        aria-label="更新"
      >↻</span>をタップしてください。
    </p>


    <!-- Discord CTA -->
    <div class="neo-community-join-v111">

      <div
        class="neo-community-join-v111__glow"
        aria-hidden="true"
      ></div>

      <a
        href="https://discord.com/invite/KZ56bjqDF"
        class="neo-community-join-v111__button"
        id="neoDiscordOpen"
        aria-label="Discord招待リンクを開く"
      >

        <span
          class="neo-community-join-v111__shine"
          aria-hidden="true"
        ></span>

        <span class="neo-community-join-v111__content">

          <span
            class="neo-community-join-v111__discord-icon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M19.54 5.34A16.3 16.3 0 0 0 15.44 4l-.5 1.02a15.1 15.1 0 0 0-5.87 0L8.55 4a16.5 16.5 0 0 0-4.1 1.35C1.85 9.2 1.15 12.95 1.5 16.65a16.6 16.6 0 0 0 5.03 2.53l1.21-1.66a10.2 10.2 0 0 1-1.9-.92l.46-.36c3.67 1.7 7.65 1.7 11.28 0l.47.36c-.61.36-1.25.67-1.91.92l1.21 1.66a16.7 16.7 0 0 0 5.04-2.53c.41-4.29-.7-8-2.85-11.31ZM8.52 14.4c-1.1 0-2-1.02-2-2.27s.88-2.28 2-2.28c1.13 0 2.02 1.03 2 2.28 0 1.25-.89 2.27-2 2.27Zm6.97 0c-1.1 0-2-1.02-2-2.27s.88-2.28 2-2.28c1.13 0 2.02 1.03 2 2.28 0 1.25-.87 2.27-2 2.27Z"
              />
            </svg>
          </span>

          <span class="neo-community-join-v111__text">
            Discord招待リンクを開く
          </span>

          <span
            class="neo-community-join-v111__arrow"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="m9 5 7 7-7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>

        </span>

      </a>

    </div>


    <!-- コピー -->
    <button
      type="button"
      class="neo-join-page__copy"
      id="neoDiscordCopy"
    >
      <svg viewBox="0 0 24 24">
        <rect
          x="8"
          y="8"
          width="11"
          height="11"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        />

        <path
          d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      招待リンクをコピー
    </button>

    <p
      class="neo-join-page__status"
      id="neoDiscordStatus"
      aria-live="polite"
    ></p>

  </main>


  <!-- 右下固定案内UI -->
  <aside
    class="neo-browser-reload-guide"
    aria-label="Discord招待画面が表示されない場合の案内"
  >

    <span
      class="neo-browser-reload-guide__icon"
      aria-hidden="true"
    >
      <svg viewBox="0 0 24 24">
        <path
          d="M20 11a8 8 0 1 0-2.34 5.66"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
        />

        <path
          d="M20 5v6h-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <span class="neo-browser-reload-guide__text">
      うまく表示されない場合は

      <strong>
        ブラウザ右下の更新ボタン<span
          class="neo-browser-reload-guide__inline-icon"
          aria-label="更新"
        >↻</span>をタップする
      </strong>
    </span>

  </aside>


  <script>
    (() => {
      const inviteUrl =
        'https://discord.com/invite/KZ56bjqDF';

      const copyButton =
        document.getElementById(
          'neoDiscordCopy'
        );

      const status =
        document.getElementById(
          'neoDiscordStatus'
        );


      const setStatus = message => {
        if(status){
          status.textContent = message;
        }
      };


      if(copyButton){
        copyButton.addEventListener(
          'click',
          async()=>{
            try{
              await navigator
                .clipboard
                .writeText(
                  inviteUrl
                );

              setStatus(
                '招待リンクをコピーしました！'
              );
            }catch(error){
              const textarea =
                document.createElement(
                  'textarea'
                );

              textarea.value =
                inviteUrl;

              textarea.setAttribute(
                'readonly',
                ''
              );

              textarea.style.position =
                'fixed';

              textarea.style.top =
                '-9999px';

              textarea.style.left =
                '-9999px';

              textarea.style.opacity =
                '0';

              document.body.appendChild(
                textarea
              );

              textarea.focus();
              textarea.select();

              try{
                document.execCommand(
                  'copy'
                );

                setStatus(
                  '招待リンクをコピーしました！'
                );
              }catch(copyError){
                setStatus(
                  'コピーできませんでした。もう一度お試しください。'
                );
              }

              textarea.remove();
            }
          }
        );
      }
    })();
  </script>


  <!-- Service Worker登録 -->
  <script>
    (() => {
      if(
        !(
          'serviceWorker' in
          navigator
        )
      ){
        return;
      }

      window.addEventListener(
        'load',
        async()=>{
          try{
            const registration =
              await navigator
                .serviceWorker
                .register(
                  './sw.js',
                  {
                    scope:'./'
                  }
                );

            registration.update();
          }catch(error){
            console.error(
              'Service Workerの登録に失敗しました。',
              error
            );
          }
        }
      );
    })();
  </script>
