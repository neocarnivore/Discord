    html,body{min-height:100%;margin:0}
    body{display:grid;min-height:100svh;place-items:center;padding:max(30px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom));overflow:hidden;color:var(--ink);background:radial-gradient(circle at 50% 20%,rgba(126,105,255,.2),transparent 37%),#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
    main{width:min(100%,620px);text-align:center}
    .mark{display:grid;width:82px;height:82px;margin:0 auto 38px;place-items:center;border:1px solid rgba(255,255,255,.42);border-radius:27px;color:#fff;background:linear-gradient(135deg,var(--purple-dark),#8c7cff);box-shadow:0 20px 45px rgba(68,45,220,.28),0 0 55px rgba(91,67,245,.18);animation:float 6s ease-in-out infinite}
    .mark svg{width:46px;height:46px}
    .eyebrow{margin:0 0 16px;color:var(--purple);font-size:13px;font-weight:900;letter-spacing:.11em}
    h1{margin:0;font-size:clamp(40px,9vw,66px);line-height:1.1;letter-spacing:-.055em;font-weight:950}
    h1 span{display:block;color:var(--purple)}
    .cta-wrap{position:relative;margin-top:50px}
    .cta-wrap:before{content:"";position:absolute;inset:-30px -20px;background:radial-gradient(ellipse,rgba(91,67,245,.2),transparent 68%);filter:blur(15px);pointer-events:none}
    .cta{position:relative;display:grid;grid-template-columns:46px 1fr 46px;min-height:78px;padding:3px;align-items:center;gap:12px;border-radius:999px;color:#fff;background:linear-gradient(115deg,var(--purple-dark),#7660ff 55%,#4933ec);box-shadow:0 16px 34px rgba(67,44,220,.3);font-size:17px;font-weight:900;text-decoration:none;transition:transform .22s ease,box-shadow .22s ease}
    .cta-icon,.arrow{display:grid;width:43px;height:43px;place-items:center;border-radius:50%}.cta-icon{margin-left:8px;background:rgba(255,255,255,.14)}.cta-icon svg{width:24px}.arrow{margin-right:8px;color:var(--purple-dark);background:#fff}.arrow svg{width:20px}
    .cta:hover{transform:translateY(-3px);box-shadow:0 21px 42px rgba(67,44,220,.36)}.cta:active{transform:scale(.99)}.cta:focus-visible{outline:3px solid rgba(91,67,245,.3);outline-offset:6px}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
    @media(max-width:540px){body{align-items:start;padding-top:max(72px,env(safe-area-inset-top))}.mark{width:74px;height:74px;margin-bottom:32px;border-radius:24px}.mark svg{width:42px}.cta-wrap{margin-top:42px}.cta{grid-template-columns:42px 1fr 42px;min-height:72px;gap:8px;font-size:15px}.cta-icon,.arrow{width:39px;height:39px}.cta-icon{margin-left:6px}.arrow{margin-right:6px}}
    @media(prefers-reduced-motion:reduce){.mark{animation:none}.cta{transition:none}}
  </style>
